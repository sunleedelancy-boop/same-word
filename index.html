
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同词相遇 · Same Word</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root {
  --pink:#d99db4;
  --deep:#9e6681;
  --cream:#fffaf5;
  --ink:#554b50;
  --muted:#a89ba0;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:'Nunito','Noto Sans SC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 10% 10%,#f8e6ec 0,transparent 35%),
    radial-gradient(ellipse at 90% 90%,#f7eadc 0,transparent 35%),
    var(--cream);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.container{width:100%;max-width:510px;text-align:center}
.top{font-size:12px;letter-spacing:4px;color:var(--deep);font-weight:800}
.logo{font-size:clamp(42px,10vw,60px);font-weight:800;letter-spacing:3px;margin:15px 0 2px;color:#a86f88}
.en{font-size:13px;letter-spacing:5px;color:var(--muted)}
.illustration{font-size:65px;margin:35px 0 18px;letter-spacing:12px}
h2{font-size:21px;font-weight:600;margin:0 0 10px}
.subtitle{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:30px}
.card{
  background:#ffffffc9;border:1px solid #f0dfe5;
  border-radius:23px;padding:25px;
  box-shadow:0 12px 35px #b98a9814;
}
.btn{
  width:100%;border:0;border-radius:14px;padding:15px;
  font:700 15px inherit;cursor:pointer;transition:.2s;
  margin:7px 0;
}
.primary{background:var(--pink);color:white;box-shadow:0 5px 14px #d99db444}
.primary:hover{background:var(--deep);transform:translateY(-2px)}
.secondary{background:#f8edf1;color:var(--deep)}
input{
  width:100%;padding:14px;border:1px solid #ead9e0;
  border-radius:12px;background:#fffdfa;
  font:14px inherit;color:var(--ink);outline:none;
  margin:8px 0;
}
input:focus{border-color:var(--pink)}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted);line-height:1.8;margin-top:20px}
.footer{font-size:11px;color:#b8a9af;margin-top:28px;letter-spacing:1px}
#message{font-size:13px;color:var(--deep);margin:12px 0;min-height:20px}
.back{background:none;border:0;color:var(--deep);cursor:pointer;margin-top:12px}
.decoration{color:#d7a8ba;font-size:14px;margin:20px}
</style>
</head>
<body>
<main class="container">
  <div class="top">✦ A LITTLE GAME FOR FRIENDS ✦</div>
  <div class="logo">同词相遇</div>
  <div class="en">SAME WORD, SAME MOMENT.</div>
  <div class="illustration">☁️ 💭 ☁️</div>
  <h2>让我们在词语的尽头相遇。</h2>
  <p class="subtitle">
    从两个不同的词语出发，<br>
    沿着彼此的思绪，一步一步走向同一个答案。
  </p>

  <section class="card" id="home">
    <button class="btn primary" onclick="show('create')">✦ 创建一个房间</button>
    <button class="btn secondary" onclick="show('join')">♡ 加入朋友的房间</button>
    <div class="note">2–4 位玩家 · 每轮 30 秒 · 无需注册</div>
  </section>

  <section class="card hidden" id="create">
    <h2>创建一场相遇</h2>
    <p class="subtitle">给自己取一个好听的昵称吧。</p>
    <input id="hostName" maxlength="12" placeholder="输入你的昵称">
    <button class="btn primary" onclick="prepare('create')">创建房间 →</button>
    <button class="back" onclick="show('home')">← 返回</button>
  </section>

  <section class="card hidden" id="join">
    <h2>加入朋友的房间</h2>
    <p class="subtitle">输入朋友分享给你的房间邀请码。</p>
    <input id="joinName" maxlength="12" placeholder="你的昵称">
    <input id="roomCode" maxlength="6" placeholder="六位房间邀请码">
    <button class="btn primary" onclick="prepare('join')">加入游戏 →</button>
    <button class="back" onclick="show('home')">← 返回</button>
  </section>

  <div id="message"></div>
  <div class="decoration">✧ ───────── ♡ ───────── ✧</div>
  <div class="footer">MADE FOR LITTLE MOMENTS & BIG CONNECTIONS</div>
</main>

<script>
function show(page){
  ['home','create','join'].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden',id!==page);
  });
  document.getElementById('message').textContent='';
}
function prepare(type){
  const name=document.getElementById(type==='create'?'hostName':'joinName').value.trim();
  const code=document.getElementById('roomCode').value.trim();
  if(!name){alert('先给自己取一个昵称吧！');return;}
  if(type==='join' && !/^[A-Za-z0-9]{6}$/.test(code)){
    alert('请输入六位房间邀请码！');return;
  }
  document.getElementById('message').textContent=
    '首页已准备好！下一步连接实时游戏后台，就可以正式创建和加入房间啦 ♡';
}
</script>
</body>
</html>
